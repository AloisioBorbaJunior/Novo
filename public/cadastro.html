<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="/cadastro.css">
  <link rel="icon" type="image/png" href="/logo-nova.png?v=2">
</head>
<body>

 <img src="/Logo-Transparente.png" alt="Logo do Sistema de Vendas" class="logo">

  <div class="login-container">
    <h2>Cadastro</h2>
    <form id="registerForm">
      <input type="text" id="newUser" name="username" placeholder="Novo usuário" autocomplete="username" required>
      <input type="password" id="newPass" name="new-password" placeholder="Nova senha" autocomplete="new-password" required>
      <button type="submit">Cadastrar</button>
    </form>
    <p id="register-message" class="error"></p>
    <p>Já tem conta? <a href="Login.html">Faça login</a></p>
  </div>
  <script src="/login.js"></script>
</body>
</html>
