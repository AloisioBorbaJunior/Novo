<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/login.css">
  <link rel="icon" type="image/png" href="/logo-nova.png?v=2">
</head>
<body>

  <img src="/Logo-Transparente.png" alt="Logo do Sistema de Vendas" class="logo">

  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" name="username" placeholder="Usuário" autocomplete="username" required>
      <input type="password" id="password" name="password" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="error-message" class="error"></p>
    <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
  


  <script src="/login.js"></script>

</body>
</html>
